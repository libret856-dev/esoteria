{% extends "base.html" %}
{% block content %}
<div class="form-container">
  <h1>Iniciar sesión</h1>
  <form method="POST">
    {{ form.hidden_tag() }}
    <div class="form-group">
      {{ form.username.label }}
      {{ form.username(class="form-control") }}
    </div>
    <div class="form-group">
      {{ form.password.label }}
      {{ form.password(class="form-control") }}
    </div>
    {{ form.submit(class="btn") }}
  </form>
</div>
{% endblock %}
